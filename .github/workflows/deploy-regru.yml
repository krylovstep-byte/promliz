name: Build & Deploy to REG.RU (FTPS)

# Триггер: пуш в main или ручной запуск
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-regru
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (minify CSS/JS/HTML → dist/)
        run: npm run build

      - name: Deploy dist/ to REG.RU via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /www/promliz.com/
          # НЕ трогать PHP-админку, SQLite-базу и серверные .htaccess
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/admin/**
            **/data/**
            **/test123.php
            **/.htaccess
            **/.env*
